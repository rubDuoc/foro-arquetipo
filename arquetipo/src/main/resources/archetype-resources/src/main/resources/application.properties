#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
spring.application.name=${artifactId}
${symbol_pound} Puerto: en el Cloud (Render) se recibe en la variable PORT
server.port=${symbol_dollar}{PORT:${puerto}}

${symbol_pound} Oracle Autonomous Database (Oracle Cloud) con wallet
${symbol_pound} TNS_ADMIN = carpeta del wallet (local: ./wallet, Render: /etc/secrets)
spring.datasource.url=jdbc:oracle:thin:@${symbol_dollar}{DB_SERVICE:bdfullstack3_low}?TNS_ADMIN=${symbol_dollar}{TNS_ADMIN:./wallet}
spring.datasource.username=${symbol_dollar}{DB_USERNAME:ADMIN}
spring.datasource.password=${symbol_dollar}{DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

${symbol_pound} JPA / Hibernate: las tablas se crean con el script de src/main/resources/db
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

${symbol_pound} CORS: origenes del frontend separados por coma
cors.origenes-permitidos=${symbol_dollar}{CORS_ORIGENES:http://localhost:4200}

${symbol_pound} Logging
logging.level.root=INFO
